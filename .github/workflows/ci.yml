name: CI — Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Run Smoke Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cloud/requirements.txt

      - name: Install system deps
        run: sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Install Python deps
        run: pip install -r cloud/requirements.txt

      - name: Run smoke tests + preflight
        env:
          DATABASE_URL: postgresql://autoreels:test_password@localhost:5432/autoreels_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-key-for-ci' }}
          FB_PAGE_ID: "000000000"
          FB_PAGE_ACCESS_TOKEN: "test_token"
          ENVIRONMENT: testing
        run: |
          cd cloud
          pytest tests/ -v -m smoke --tb=short
          python validate_env.py --mode real-run
          python main.py --preflight

  test:
    name: Run Full Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoreels_test
          POSTGRES_USER: autoreels
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cloud/requirements.txt

      - name: Install system deps
        run: sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Install Python deps
        run: pip install -r cloud/requirements.txt

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql://autoreels:test_password@localhost:5432/autoreels_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-key-for-ci' }}
          FB_PAGE_ID: "000000000"
          FB_PAGE_ACCESS_TOKEN: "test_token"
          ENVIRONMENT: testing
        run: |
          cd cloud
          pytest tests/ -v --tb=short

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: cloud/.coverage
          retention-days: 7
          if-no-files-found: ignore
