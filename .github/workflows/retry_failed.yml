name: Retry Failed Uploads

on:
  schedule:
    - cron: '30 */6 * * *'   # Every 6 hours, offset from main pipeline
  workflow_dispatch:

jobs:
  retry:
    name: Retry Dead Letter Queue
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore databases
        uses: actions/cache@v4
        with:
          path: |
            cloud/queue/hooks.db
            cloud/queue/ab.db
            cloud/queue/analytics.db
            cloud/queue/failed.db
            cloud/queue/velocity.db
            cloud/queue/comments.db
            cloud/queue/thumbnail_ab.db
            cloud/queue/account_rotation.db
            cloud/queue/jobs.db
          key: autoreels-sqlite-dbs-v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cloud/requirements.txt

      - name: Install system deps
        run: sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Install Python deps
        run: pip install -r cloud/requirements.txt

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Configure yt-dlp JS runtime
        run: |
          mkdir -p ~/.config/yt-dlp
          echo "--js-runtimes node" >> ~/.config/yt-dlp/config

      - name: Write YouTube cookies (optional)
        run: |
          if [ -n "${{ secrets.YT_COOKIES_JSON }}" ]; then
            mkdir -p cloud/config
            printf '%s' "${{ secrets.YT_COOKIES_JSON }}" > cloud/config/cookies.tmp
            first_char=$(head -c 1 cloud/config/cookies.tmp || true)
            if [ "$first_char" = "{" ] || [ "$first_char" = "[" ]; then
              if python cloud/utils/convert_cookies_json_to_netscape.py cloud/config/cookies.tmp cloud/config/cookies.txt; then
                rm cloud/config/cookies.tmp
              else
                mv cloud/config/cookies.tmp cloud/config/cookies.txt
              fi
            else
              mv cloud/config/cookies.tmp cloud/config/cookies.txt
            fi
          else
            echo "YT_COOKIES_JSON not set; skipping cookies write"
          fi

      - name: Validate yt-dlp and cookies
        env:
          YTDLP_HEALTH_STRICT: "0"
        run: |
          echo "Running yt-dlp health check"
          python cloud/utils/yt_dlp_health_check.py || (
            echo "Health check failed — printing any yt-dlp debug logs"
            ls -la cloud/queue/tmp || true
            shopt -s nullglob
            for f in cloud/queue/tmp/*yt_dlp_debug_*; do
              echo "---- $f ----"
              tail -n 200 "$f" || true
            done
            shopt -u nullglob
            exit 1
          )

      - name: Retry failed uploads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOREELS_FORCE_RUN: "1"
          ENVIRONMENT: "github_actions"
        run: |
          cd cloud
          python main.py --retry-failed

      - name: Save databases
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            cloud/queue/hooks.db
            cloud/queue/ab.db
            cloud/queue/analytics.db
            cloud/queue/failed.db
            cloud/queue/velocity.db
            cloud/queue/comments.db
            cloud/queue/thumbnail_ab.db
            cloud/queue/account_rotation.db
            cloud/queue/jobs.db
          key: autoreels-sqlite-dbs-v2
